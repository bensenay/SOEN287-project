<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Page</title>
    <link rel="stylesheet" href="course.css">
</head>
<body>
<div class="header">
    <h1 id="classHeader"></h1>
    <a href="admin.html">
        <h1>Go back</h1>
    </a>
</div>
<div class="container">
    <div class="course-section">
        <div class="grade-container">
            <h1 style="font-size: 50px">Average Grade:<span id="average"  style="padding-left: 20px"></span></h1>

        </div>
    </div>
    <div class="course-section">
        <div class="graph-container" id="assessment-graph">

        </div>
    </div>
    <div class="course-section">
        <h2>General Information</h2>
        <hr>
        <h3>Course code: <span id="course-code"></span></h3>
        <h3>Professor: <span id="professor"></span></h3>
        <h3>Term: <span id="term"></span></h3>
        <a id="add-assessment-link" href="#"><h3>+ Add Assessment +</h3></a>
        <script>
            const urlParams = new URLSearchParams(window.location.search);
            const currentId = urlParams.get("id");
            const addBtn = document.getElementById("add-assessment-link");
            addBtn.href= `addAssessments.html?id=${currentId}`;
        </script>
        <button onclick="resetAssessments()">Reset Assessments</button>
        <hr>
    </div>
    <div class="course-section" id="assessment-grid-admin">
        <div id="student-selector-container">
            <label>Grade a student: </label>
            <select id="student-selector"></select>
        </div>
        <div class="section-header">
            <h2>Assignments</h2>
            <div class="weight-badge">
                <h3>Weight: <span class="weight-value" id="weight-display-Assignment"></span>%</h3>
                <button class="edit-weight-btn" onclick="toggleWeightEdit('Assignment')">Edit</button>
                <span id="weight-edit-Assignment" style="display: none">
                    <input class="weight-input" type="number" min="0" max="100" id="weight-input-Assignment">
                    <button class="save-weight-btn" onclick="saveWeight('Assignment')">Save</button>
                </span>

            </div>
        </div>
        <hr>
        <div id="assignment-section" >

        </div>
    </div>
    <div class="course-section">
        <h2>Exams</h2>
        <div class="weight-badge">
            <h3>Weight: <span class="weight-value" id="weight-display-Exam"></span>%</h3>
            <button class="edit-weight-btn" onclick="toggleWeightEdit('Exam')">Edit</button>
            <span id="weight-edit-Exam" style="display: none">
                    <input class="weight-input" type="number" min="0" max="100" id="weight-input-Exam">
                    <button class="save-weight-btn" onclick="saveWeight('Exam')">Save</button>
                </span>

        </div>
        <hr>
        <div id="exam-section">

        </div>
    </div>
    <div class="course-section">
        <h2>Quizzes</h2>
        <div class="weight-badge">
            <h3>Weight: <span class="weight-value" id="weight-display-Quiz"></span>%</h3>
            <button class="edit-weight-btn" onclick="toggleWeightEdit('Quiz')">Edit</button>
            <span id="weight-edit-Quiz" style="display: none">
                    <input class="weight-input" type="number" min="0" max="100" id="weight-input-Quiz">
                    <button class="save-weight-btn" onclick="saveWeight('Quiz')">Save</button>
                </span>

        </div>
        <hr>
        <div id="quiz-section">

        </div>
    </div>
    <div class="course-section">
        <h2>Labs</h2>
        <div class="weight-badge">
            <h3>Weight: <span class="weight-value" id="weight-display-Lab"></span>%</h3>
            <button class="edit-weight-btn" onclick="toggleWeightEdit('Lab')">Edit</button>
            <span id="weight-edit-Lab" style="display: none">
                    <input class="weight-input" type="number" min="0" max="100" id="weight-input-Lab">
                    <button class="save-weight-btn" onclick="saveWeight('Lab')">Save</button>
                </span>

        </div>
        <hr>
        <div id="lab-section"></div>
    </div>
</div>
<script src="manageClasses.js"></script>
</body>
</html>
