<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Page</title>
    <link rel="stylesheet" href="course.css">
</head>
<body>
<div class="header">

    <!--header/navbar-->
    <h1 id="course-header"></h1>
    <a href="student.html">
        <h1 class="back">Go back</h1>
    </a>
</div>
<div class="container">
    <div class="course-section">

        <!-- average in class-->
        <div class="grade-container">
            <h1 style="font-size: 50px">Average Grade:<span id="average"  style="padding-left: 20px"></span></h1>

        </div>
    </div>
    <div class="course-section">

        <!--graph showing grades for each assessment type-->
        <div class="graph-container" id="assessment-graph">

        </div>
    </div>

    <!-- all info about the course gets placed here-->
    <div class="course-section">
        <h2>General Information</h2>
        <hr>
        <h3>Course code: <span id="course-code"></span></h3>
        <h3>Professor: TBD<span id="professor"></span></h3>
        <h3>Term: <span id="term"></span></h3>
    </div>
    <div class="course-section" id="assessment-grid">
        <h2>Assignments</h2>
        <hr>

        <!--assignments get placed here-->
        <div id="assignment-section" >

        </div>
    </div>
    <div class="course-section">
        <h2>Exams</h2>
        <hr>

        <!--exams get placed here-->
        <div id="exam-section">

        </div>
    </div>
    <div class="course-section">
        <h2>Quizzes</h2>
        <hr>

        <!--quizzes get placed here-->
        <div id="quiz-section">

        </div>
    </div>
    <div class="course-section">
        <h2>Labs</h2>
        <hr>

        <!-- labs get placed here-->
        <div id="lab-section"></div>
    </div>
</div>
<script src="manageClasses.js"></script>
</body>
</html>
