<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BetterMoodle</title>
    <link rel="stylesheet" href="signInORsignUp.css">
</head>

<body>
<div class="container">
    <h1>Available Classes</h1>

    <div id="courses-section">

    </div>

    <div class="form-group" style="display: flex; flex-direction: column;align-items: center;">
        <label for="classCode">Which class do you want to enroll in?</label> <br>
        <input type="text" id="classCode" placeholder="Class code">
    </div>

    <div class="button">
        <!-- button calls function to enroll student in class -->
        <button type="button" onclick="enrollInCourse(document.getElementById('classCode').value)">Confirm</button>
    </div>

</div>
<script src="manageClasses.js"></script>
</body>
</html>
