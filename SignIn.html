<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BetterMoodle</title>
    <link rel="stylesheet" href="signInORsignUp.css">
</head>

<body>
<div class="container">
    <h1>Better Moodle</h1>
    <h2>Login</h2>

    <div class="form-group">
        <label for="UserEmail">Email Address</label> <br>
        <input type="email" id="UserEmail" placeholder="Enter your Email">
    </div>

    <div class="form-group">
        <label for="UserPassword">Password</label> <br>
        <input type="password" id="UserPassword" placeholder="Enter your Password">
    </div>

    <div class ="HyperLink">
        <a  href="SignUp.html">I don't have an account.</a>
    </div>

    <div class="button">
        <input type="submit" value="Login">
    </div>

</div>



</body>
</html>
