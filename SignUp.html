<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BetterMoodle</title>
    <link rel="stylesheet" href="signInORsignUp.css">
</head>
<body>

<form id="signupForm">
    <div class="container">
        <h2>Sign Up</h2>

        <div class="form-group">
            <label for="FirstName">First Name</label> <br>
            <input type="text" id="FirstName" placeholder="Enter your First Name" pattern="[A-Za-z]+"
                   title="Only alphabetic characters are allowed (A-Z, a-z)" required>
        </div>

        <div class="form-group">
            <label for="UserEmail">Email Address</label> <br>
            <input type="email" id="UserEmail" placeholder="Enter your Email" required>
        </div>

        <div class="form-group">
            <label for="UserPassword">Password</label> <br>
            <input type="password" id="UserPassword" placeholder="Enter your Password" minlength="5" required>
        </div>

        <div class="form-group">
            <div class="radio-group">
                <p style="text-align: left;">I am a:</p> <br>
                <div class="radio-option">
                    <input type="radio" id="Student" name="TypeOfUser" value="Student" required>
                    <label for="Student">Student</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="Admin" name="TypeOfUser" value="Admin" required>
                    <label for="Admin">Admin</label>
                </div>
            </div>

            <div class ="HyperLink">
                <a href="SignIn.html">I already have an account</a>
            </div>

            <div class="button">
                <button type="submit" onclick="signUp(event)">Sign Up</button>
            </div>
        </div>
    </div>
</form>

<script src="auth.js"></script>
</body>
</html>
