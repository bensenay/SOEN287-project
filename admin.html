<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Page</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="header">
    <h1 class="admindash">Admin Dashboard</h1>
    <a href="SignIn.html">
        <h1 class="logout">Log Out</h1>
    </a>
</div>

<div class="admin-options">
    <section class="coursemanagement">
        <h2> Manage Courses</h2>
    </section>
</div>

<div class="tab">
    <button class="tablinks" data-tab="create">Create</button>
    <button class="tablinks" data-tab="remove">Remove</button>
    <button class="tablinks" data-tab="restrict">Enable/Disable</button>
</div>

<div id="create" class="tabcontent">
    <h3>Create Course</h3>
    <p>Here you can create a new course.</p>

    <div class="form-group">
        <label for="classCode">Class Code:</label> <br>
        <input type="text" id="classCode" placeholder="Create your Class Code"> <br>
    </div>
    <div class="form-group">
        <label for="className">Class Name:</label> <br>
        <input type="text" id="className" placeholder="Class name"> <br>
    </div>
    <div class="form-group">
        <label for="term">Term:</label> <br>
        <input type="text" id="term" placeholder="Term"> <br>
    </div>

    <div class="button">
        <button type="submit" onclick="createCourse(document.getElementById('classCode').value, document.getElementById('className').value, document.getElementById('term').value)">Create Course</button>
    </div>
</div>

<div id="remove" class="tabcontent">
    <h3>Remove Course</h3>
    <p>Here you can remove an existing course.</p>
    <div class="form-group">
        <label for="class-code">Class code:</label> <br>
        <input type="text" id="class-code" placeholder="Class Code"> <br>
    </div>
    <div class="button">
        <button type="submit" onclick="deleteCourse(document.getElementById('class-code').value)">Delete Course</button>
    </div>
</div>

<div id="restrict" class="tabcontent">
    <h3>Enable/Disable Course</h3>
    <p>Enable or disable courses for student access.</p>
    <div class="course-grid" id="restrict-course-grid"></div>
</div>

<div class="course-overview">
    <h1>Course Overview</h1>
</div>
<div class="course-grid" id="admin-course-grid">

</div>
<script src="adminManageCourses.js"></script>
<script src="manageClasses.js"></script>
</body>
</html>
